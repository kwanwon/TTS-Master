name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 pygame pydub requests psutil numpy openai huggingface-hub

      - name: Build Windows Executable
        run: |
          pyinstaller main.py --name AIMaster_TTS_Windows --windowed --onedir --clean --add-data "version.json;." --add-data "core;core" --add-data "ui;ui" --add-data "utils;utils" --hidden-import PyQt6 --hidden-import pygame --hidden-import pydub --hidden-import requests --hidden-import numpy --hidden-import openai --hidden-import huggingface_hub --noconfirm
        shell: cmd

      - name: Copy Extra Resources if exist
        run: |
          if exist voice_samples xcopy /E /I voice_samples dist\AIMaster_TTS_Windows\voice_samples
        shell: cmd

      - name: Create Windows ZIP
        run: |
          cd dist
          Compress-Archive -Path "AIMaster_TTS_Windows" -DestinationPath "AIMaster_TTS_Windows.zip"
        shell: powershell

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIMaster-TTS-Windows
          path: dist/AIMaster_TTS_Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 pygame pydub requests psutil numpy openai huggingface-hub

      - name: Build macOS App
        run: |
          pyinstaller main.py --name AIMaster_TTS_Mac --windowed --clean --add-data "version.json:." --add-data "core:core" --add-data "ui:ui" --add-data "utils:utils" --hidden-import PyQt6 --hidden-import pygame --hidden-import pydub --hidden-import requests --hidden-import numpy --hidden-import openai --hidden-import huggingface_hub --noconfirm

      - name: Create macOS ZIP
        run: |
          cd dist
          zip -r "AIMaster_TTS_Mac.zip" "AIMaster_TTS_Mac.app"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIMaster-TTS-Mac
          path: dist/AIMaster_TTS_Mac.zip

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: AIMaster-TTS-Mac
          path: ./release-files/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: AIMaster-TTS-Windows
          path: ./release-files/

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "AI 마스터 (TTS 컨트롤) ${{ steps.get_version.outputs.VERSION }}"
          body: |
            ## 🎉 AI 마스터 (TTS 컨트롤) ${{ steps.get_version.outputs.VERSION }} 릴리스
            
            ### 📥 다운로드
            - **🪟 Windows 사용자**: `AIMaster_TTS_Windows.zip` (압축 해제 후 `AIMaster_TTS_Windows.exe` 실행)
            - **🍎 macOS 사용자**: `AIMaster_TTS_Mac.zip` (압축 해제 후 `AIMaster_TTS_Mac.app` 실행)
            
            ### 🔐 시리얼 라이선스
            첫 실행 시 라이선스 시리얼 번호를 입력해주세요.
          files: |
            ./release-files/AIMaster_TTS_Windows.zip
            ./release-files/AIMaster_TTS_Mac.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}