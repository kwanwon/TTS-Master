name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 pygame pydub requests psutil

      - name: Build Windows Executable
        run: |
          pyinstaller main.py --name AIMaster_TTS_Windows --windowed --onedir --clean --collect-all PyQt6 --collect-all pygame --collect-all pydub --collect-all requests --noconfirm
        shell: cmd

      - name: Copy Resources to dist folder
        run: |
          copy version.json dist\AIMaster_TTS_Windows\
          xcopy /E /I core dist\AIMaster_TTS_Windows\core
          xcopy /E /I ui dist\AIMaster_TTS_Windows\ui
          xcopy /E /I utils dist\AIMaster_TTS_Windows\utils
          if exist voice_samples xcopy /E /I voice_samples dist\AIMaster_TTS_Windows\voice_samples
        shell: cmd

      - name: Create Windows ZIP
        run: |
          cd dist
          Compress-Archive -Path "AIMaster_TTS_Windows" -DestinationPath "AIMaster_TTS_Windows.zip"
        shell: powershell

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIMaster-TTS-Windows
          path: dist/AIMaster_TTS_Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 pygame pydub requests psutil

      - name: Build macOS App
        run: |
          pyinstaller main.py --name AIMaster_TTS_Mac --windowed --onedir --clean --collect-all PyQt6 --collect-all pygame --collect-all pydub --collect-all requests --noconfirm

      - name: Copy Resources to macOS App Bundle
        run: |
          APP_RESOURCES="dist/AIMaster_TTS_Mac.app/Contents/Resources"
          mkdir -p "$APP_RESOURCES"
          cp version.json "$APP_RESOURCES/"
          cp -R core "$APP_RESOURCES/"
          cp -R ui "$APP_RESOURCES/"
          cp -R utils "$APP_RESOURCES/"
          if [ -d "voice_samples" ]; then cp -R voice_samples "$APP_RESOURCES/"; fi

      - name: Create macOS ZIP
        run: |
          cd dist
          zip -r "AIMaster_TTS_Mac.zip" "AIMaster_TTS_Mac.app"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIMaster-TTS-Mac
          path: dist/AIMaster_TTS_Mac.zip

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, "refs/tags/")
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: AIMaster-TTS-Mac
          path: ./release-files/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: AIMaster-TTS-Windows
          path: ./release-files/

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "AI 마스터 (TTS 컨트롤) ${{ steps.get_version.outputs.VERSION }}"
          body: |
            ## 🎉 AI 마스터 (TTS 컨트롤) ${{ steps.get_version.outputs.VERSION }} 릴리스
            
            ### 📥 다운로드
            - **🪟 Windows 사용자**: `AIMaster_TTS_Windows.zip` (압축 해제 후 `AIMaster_TTS_Windows.exe` 실행)
            - **🍎 macOS 사용자**: `AIMaster_TTS_Mac.zip` (압축 해제 후 `AIMaster_TTS_Mac.app` 실행)
            
            ### 🔐 시리얼 라이선스
            첫 실행 시 라이선스 시리얼 번호를 입력해주세요.
          files: |
            ./release-files/AIMaster_TTS_Windows.zip
            ./release-files/AIMaster_TTS_Mac.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}